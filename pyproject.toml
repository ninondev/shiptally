[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "shiptally"
version = "0.1.0"
description = "Join local AI coding usage to git output, per project."
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Ninon"}]
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console"]

[project.scripts]
shiptally = "shiptally.cli:main"

[project.urls]
Repository = "https://github.com/ninondev/shiptally"
